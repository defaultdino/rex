name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BIN_NAME: rexamp
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: .github/scripts/release-version.sh
      - name: Install system libraries
        # libssl-dev: the optional `cast` feature links the system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features cast -- -D warnings

  package:
    if: github.event_name == 'push'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package .deb
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Package .rpm
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Package .tar.gz
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          DIR="${BIN_NAME}-${VERSION}-${{ matrix.arch }}-linux"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$DIR/"
          cp README* LICENSE* "$DIR/" 2>/dev/null || true
          cp "doc/${BIN_NAME}.1" "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - name: Collect packages
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          cp *.tar.gz dist/
          ls -lh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  smoke-test:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - image: archlinux:latest
            install: >-
              pacman -Sy --noconfirm alsa-lib &&
              tar xzf dist/*.tar.gz && install -m755 */"$BIN_NAME" /usr/local/bin/
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-x86_64
          path: dist
      - name: Install
        run: ${{ matrix.install }}
      - name: Run
        run: |
          command -v "$BIN_NAME"
          "$BIN_NAME" --version

  release:
    if: github.event_name == 'push' && needs.check.outputs.release == 'true'
    needs: [check, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          persist-credentials: false
      - name: Vendor crates
        run: |
          cargo install --locked cargo-vendor-filterer --version 0.5.18
          cd src
          cargo vendor-filterer --platform '*-unknown-linux-*' ../vendor
          cd ..
          tar cJf "dist/${BIN_NAME}-${VERSION}-vendor.tar.xz" vendor
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --generate-notes
